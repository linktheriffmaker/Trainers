<style>

.scroller::-webkit-scrollbar { height: 3px; }

<body style="margin:0;padding:0;background:#1a1a2e">
<div style="background:#1a1a2e;border-bottom:1px solid #2a2a45;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:1000;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <a href="index.html" style="display:flex;align-items:center;gap:7px;text-decoration:none;color:#e8e8f0;font-weight:700;font-size:14px;flex-shrink:0">
    <span style="font-size:16px;line-height:1">&#127929;</span><span>Piano Trainers</span>
  </a>
  <div class="scroller" style="display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto"><a href="scales.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:700;white-space:nowrap;background:#4f46e5;color:#ffffff;border:1px solid #6360f0;">Scales</a><a href="arpeggios.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:500;white-space:nowrap;background:transparent;color:#9090b0;border:1px solid #404060;">Arpeggios</a><a href="inversions.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:500;white-space:nowrap;background:transparent;color:#9090b0;border:1px solid #404060;">Inversions</a><a href="chords.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:500;white-space:nowrap;background:transparent;color:#9090b0;border:1px solid #404060;">Style Chords</a><a href="intervals.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:500;white-space:nowrap;background:transparent;color:#9090b0;border:1px solid #404060;">Intervals</a><a href="sight-reading.html" style="font-size:12px;padding:6px 13px;border-radius:7px;text-decoration:none;font-family:inherit;font-weight:500;white-space:nowrap;background:transparent;color:#9090b0;border:1px solid #404060;">Sight Reading</a></div>
</div>


<div id="app" style="background:#1a1a2e;color:#e8e8f0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh">

  <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">
    <span style="font-size:11px;color:#9090b0;text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;min-width:38px">Root</span>
    <div class="scroller" id="seg-root"></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">
    <span style="font-size:11px;color:#9090b0;text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;min-width:38px">Scale</span>
    <div class="scroller" id="seg-scale"></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px" id="action-row"></div>

  <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:12px;border-radius:8px;background:#252540;border:1px solid #404060">
    <button id="unlock-btn" style="font-size:13px;padding:5px 14px;border-radius:7px;cursor:pointer;border:1px solid #22c55e;background:#166534;color:#ffffff;font-family:inherit;font-weight:600;white-space:nowrap">🔊 Enable audio</button>
    <span id="audio-hint" style="font-size:12px;color:#8080a0">Tap first — then click any key to hear it</span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#7070a0"><div style="width:11px;height:11px;border-radius:50%;background:#f43f5e;flex-shrink:0"></div>Root</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#7070a0"><div style="width:11px;height:11px;border-radius:50%;background:#38bdf8;flex-shrink:0"></div>5th</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#7070a0"><div style="width:11px;height:11px;border-radius:50%;background:#4ade80;flex-shrink:0"></div>3rd/6th/7th</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#7070a0"><div style="width:11px;height:11px;border-radius:50%;background:#94a3b8;flex-shrink:0"></div>Other</div>
  </div>

  <div id="fb-outer" style="overflow-x:auto;overflow-y:hidden;border-radius:10px">
    <div style="position:relative;display:inline-block">
      <canvas id="fb"></canvas>
      <div id="tooltip" style="display:none;position:absolute;border-radius:8px;padding:5px 10px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:20;font-weight:500;background:#303055;border:1px solid #505070;color:#e8e8f8"></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
    <button id="zoom-out" style="font-size:14px;width:30px;height:30px;line-height:1;cursor:pointer;border-radius:7px;border:1px solid #404060;background:#252540;color:#e8e8f0;font-family:inherit;font-weight:700">－</button>
    <span id="zoom-label" style="font-size:11px;color:#7070a0;min-width:38px;text-align:center">100%</span>
    <button id="zoom-in" style="font-size:14px;width:30px;height:30px;line-height:1;cursor:pointer;border-radius:7px;border:1px solid #404060;background:#252540;color:#e8e8f0;font-family:inherit;font-weight:700">＋</button>
    <span style="font-size:11px;color:#50506a">Zoom the keyboard for a sharper, easier-to-tap view</span>
  </div>
  <div id="info" style="font-size:11px;color:#50506a;margin-top:8px;min-height:14px"></div>

  <div id="quiz-panel" style="display:none;margin-top:12px;padding:12px;border-radius:10px;background:#252540;border:1px solid #404060">
    <div id="quiz-q" style="font-size:13px;color:#d0d0f0;margin-bottom:8px;font-weight:500">Tap any outlined key to identify it.</div>
    <div id="quiz-opts" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <div id="quiz-feedback" style="margin-top:9px;font-size:13px;font-weight:600"></div>
    <div id="quiz-score" style="font-size:12px;margin-top:4px;color:#60607a"></div>
  </div>
</div>

<script>
const ROOTS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const SCALES={
  "Pentatonic Minor":{i:[0,3,5,7,10],d:["1","b3","4","5","b7"]},
  "Pentatonic Major":{i:[0,2,4,7,9],d:["1","2","3","5","6"]},
  "Major":{i:[0,2,4,5,7,9,11],d:["1","2","3","4","5","6","7"]},
  "Natural Minor":{i:[0,2,3,5,7,8,10],d:["1","2","b3","4","5","b6","b7"]},
  "Blues":{i:[0,3,5,6,7,10],d:["1","b3","4","b5","5","b7"]},
  "Dorian":{i:[0,2,3,5,7,9,10],d:["1","2","b3","4","5","6","b7"]},
  "Phrygian":{i:[0,1,3,5,7,8,10],d:["1","b2","b3","4","5","b6","b7"]},
  "Lydian":{i:[0,2,4,6,7,9,11],d:["1","2","3","#4","5","6","7"]},
  "Mixolydian":{i:[0,2,4,5,7,9,10],d:["1","2","3","4","5","6","b7"]},
  "Harmonic Minor":{i:[0,2,3,5,7,8,11],d:["1","2","b3","4","5","b6","7"]},
  "Melodic Minor":{i:[0,2,3,5,7,9,11],d:["1","2","b3","4","5","6","7"]},
  "Whole Tone":{i:[0,2,4,6,8,10],d:["1","2","3","#4","#5","b7"]},
  "Diminished":{i:[0,1,3,4,6,7,9,10],d:["1","b2","b3","3","b5","5","6","b7"]}
};
const SCNAMES=Object.keys(SCALES);

let rootIdx=0,scaleIdx=2,isDark=true;
let showDegrees=true,showNames=false,quizMode=false;
let audioCtx=null,audioUnlocked=false;
let nodes=[],quizScore={r:0,w:0};

/* ---- keyboard geometry: 2 octaves, C4 to C6 ---- */
const START_MIDI=60, OCTAVES=2, END_MIDI=START_MIDI+OCTAVES*12;
const NOTE_INFO=[
  {name:'C',white:true},{name:'C#',white:false},{name:'D',white:true},{name:'D#',white:false},
  {name:'E',white:true},{name:'F',white:true},{name:'F#',white:false},{name:'G',white:true},
  {name:'G#',white:false},{name:'A',white:true},{name:'A#',white:false},{name:'B',white:true}
];
const WKW=46,WKH=172,BKW=28,BKH=108,PT=8;
const KEYS=[];
let whiteCount=0;
for(let m=START_MIDI;m<=END_MIDI;m++){ if(NOTE_INFO[m%12].white){ KEYS.push({midi:m,white:true,name:NOTE_INFO[m%12].name,x:whiteCount*WKW,w:WKW,h:WKH}); whiteCount++; } }
let wc2=0;
for(let m=START_MIDI;m<=END_MIDI;m++){
  if(NOTE_INFO[m%12].white){ wc2++; }
  else { KEYS.push({midi:m,white:false,name:NOTE_INFO[m%12].name,x:wc2*WKW-BKW/2,w:BKW,h:BKH}); }
}
const CVW=whiteCount*WKW, CVH=PT+WKH+22;
function octaveOf(midi){ return Math.floor(midi/12)-1; }

// Button state definitions
const BTNS=[
  {id:"btn-root-play", label:"♪ Root",   onBg:"#1d4ed8", onColor:"#fff", onBorder:"#3b6ef0", offBg:"#1d4ed8", offColor:"#fff", offBorder:"#3b6ef0", toggle:false},
  {id:"btn-scale-play",label:"▶ Scale",  onBg:"#1d4ed8", onColor:"#fff", onBorder:"#3b6ef0", offBg:"#1d4ed8", offColor:"#fff", offBorder:"#3b6ef0", toggle:false},
  {id:"btn-quiz",      label:"◎ Quiz",   onBg:"#b45309", onColor:"#fff", onBorder:"#d97706", offBg:"#303050", offColor:"#c0c0e0", offBorder:"#505070", toggle:true},
  {id:"btn-degrees",   label:"● Degrees",onBg:"#166534", onColor:"#fff", onBorder:"#22c55e", offBg:"#303050", offColor:"#c0c0e0", offBorder:"#505070", toggle:true, initOn:true},
  {id:"btn-names",     label:"♩ Names",  onBg:"#6d28d9", onColor:"#fff", onBorder:"#9f67fa", offBg:"#303050", offColor:"#c0c0e0", offBorder:"#505070", toggle:true},
  {id:"btn-theme",     label:"☀ Light",  onBg:"#374151", onColor:"#fff", onBorder:"#6b7280", offBg:"#374151", offColor:"#fff",    offBorder:"#6b7280",  toggle:false},
];

function btnStyle(def,isOn){
  const bg=isOn?def.onBg:def.offBg;
  const col=isOn?def.onColor:def.offColor;
  const bdr=isOn?def.onBorder:def.offBorder;
  return `font-size:12px;padding:6px 13px;cursor:pointer;border-radius:7px;border:1px solid ${bdr};background:${bg};color:${col};font-family:inherit;white-space:nowrap;font-weight:500;line-height:1.4`;
}

function buildActionRow(){
  const row=document.getElementById("action-row");
  row.innerHTML="";
  const states={ "btn-quiz":quizMode, "btn-degrees":showDegrees, "btn-names":showNames };
  BTNS.forEach(def=>{
    const b=document.createElement("button");
    b.id=def.id;
    const isOn=def.toggle?(states[def.id]!==undefined?states[def.id]:!!def.initOn):true;
    b.style.cssText=btnStyle(def,isOn);
    b.textContent=def.id==="btn-quiz"&&quizMode?"✕ Exit quiz":
                  def.id==="btn-theme"&&!isDark?"🌙 Dark":def.label;
    b.addEventListener("mouseenter",()=>{b.style.opacity="0.85";});
    b.addEventListener("mouseleave",()=>{b.style.opacity="1";});
    b.onclick=btnHandlers[def.id];
    row.appendChild(b);
  });
}

const btnHandlers={
  "btn-root-play":()=>{
    if(!audioUnlocked){alert("Tap Enable audio first");return;}
    playNote(rootIdx+60,1.2);
  },
  "btn-scale-play":()=>{
    if(!audioUnlocked){alert("Tap Enable audio first");return;}
    const sc=SCALES[SCNAMES[scaleIdx]];
    let d=0;sc.i.forEach(iv=>{playNote(rootIdx+60+iv,.45,d);d+=.28;});
    playNote(rootIdx+72,.8,d);
  },
  "btn-quiz":()=>{
    quizMode=!quizMode;
    const panel=document.getElementById("quiz-panel");
    if(quizMode){
      panel.style.display="block";
      document.getElementById("quiz-q").textContent="Tap any outlined key on the keyboard.";
      document.getElementById("quiz-opts").innerHTML="";
      document.getElementById("quiz-feedback").textContent="";
    } else {
      panel.style.display="none";
    }
    buildActionRow();draw();
  },
  "btn-degrees":()=>{showDegrees=!showDegrees;buildActionRow();draw();},
  "btn-names":()=>{showNames=!showNames;buildActionRow();draw();},
  "btn-theme":()=>{
    isDark=!isDark;
    const app=document.getElementById("app");
    if(isDark){
      app.style.background="#1a1a2e";app.style.color="#e8e8f0";
      document.getElementById("quiz-panel").style.background="#252540";
      document.getElementById("quiz-panel").style.borderColor="#404060";
      document.getElementById("quiz-q").style.color="#d0d0f0";
      document.getElementById("quiz-score").style.color="#60607a";
      document.getElementById("info").style.color="#50506a";
      document.getElementById("tooltip").style.background="#303055";
      document.getElementById("tooltip").style.borderColor="#505070";
      document.getElementById("tooltip").style.color="#e8e8f8";
    } else {
      app.style.background="#f0ece4";app.style.color="#1a1a2e";
      document.getElementById("quiz-panel").style.background="#ffffff";
      document.getElementById("quiz-panel").style.borderColor="#dddddd";
      document.getElementById("quiz-q").style.color="#1a1a2e";
      document.getElementById("quiz-score").style.color="#9ca3af";
      document.getElementById("info").style.color="#c0b8a8";
      document.getElementById("tooltip").style.background="#ffffff";
      document.getElementById("tooltip").style.borderColor="#cccccc";
      document.getElementById("tooltip").style.color="#1a1a2e";
    }
    buildActionRow();buildSegs();draw();
  }
};

function sbtnStyle(isOn){
  if(isOn) return "font-size:12px;padding:5px 11px;cursor:pointer;border-radius:7px;border:1px solid #6360f0;background:#4f46e5;color:#ffffff;font-family:inherit;white-space:nowrap;flex-shrink:0";
  if(isDark) return "font-size:12px;padding:5px 11px;cursor:pointer;border-radius:7px;border:1px solid #404060;background:#252540;color:#c0c0e0;font-family:inherit;white-space:nowrap;flex-shrink:0";
  return "font-size:12px;padding:5px 11px;cursor:pointer;border-radius:7px;border:1px solid #ccccdd;background:#ffffff;color:#444466;font-family:inherit;white-space:nowrap;flex-shrink:0";
}

function buildSegs(){
  ["seg-root","seg-scale"].forEach((id,si)=>{
    const wrap=document.getElementById(id);wrap.innerHTML="";
    const list=si===0?ROOTS:SCNAMES;
    const current=si===0?rootIdx:scaleIdx;
    list.forEach((label,i)=>{
      const b=document.createElement("button");
      b.style.cssText=sbtnStyle(i===current);
      b.textContent=label;
      b.onclick=()=>{if(si===0)rootIdx=i;else scaleIdx=i;buildSegs();draw();};
      wrap.appendChild(b);
    });
  });
}

const DARK={
  canvasBg:"#0d0d1a",whiteKey:"#f0f0ee",whiteKeyStroke:"#6a6a85",blackKey:"#141420",blackKeyStroke:"#000",octLbl:"#505068",
  root:{fill:"#f43f5e",glow:"rgba(244,63,94,.7)",text:"#fff"},
  fifth:{fill:"#38bdf8",glow:"rgba(56,189,248,.6)",text:"#001825"},
  third:{fill:"#4ade80",glow:"rgba(74,222,128,.5)",text:"#001a0c"},
  other:{fill:"#475569",glow:"rgba(71,85,105,.4)",text:"#e2e8f0"}
};
const LIGHT={
  canvasBg:"#e8e0d0",whiteKey:"#fffdf7",whiteKeyStroke:"#a89878",blackKey:"#241a10",blackKeyStroke:"#000",octLbl:"#b0a070",
  root:{fill:"#e11d48",glow:"rgba(225,29,72,.35)",text:"#fff"},
  fifth:{fill:"#0284c7",glow:"rgba(2,132,199,.35)",text:"#fff"},
  third:{fill:"#16a34a",glow:"rgba(22,163,74,.32)",text:"#fff"},
  other:{fill:"#78716c",glow:"rgba(120,113,108,.3)",text:"#fff"}
};
function th(){return isDark?DARK:LIGHT;}
function nodeCol(deg){
  const T=th();
  if(deg==="1")return T.root;
  if(deg==="5")return T.fifth;
  if(["3","b3","7","b7","6","b6","#4","2","4","b5","#5","b2"].includes(deg))return T.third;
  return T.other;
}

function initAudio(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const buf=audioCtx.createBuffer(1,1,22050);
    const s=audioCtx.createBufferSource();s.buffer=buf;s.connect(audioCtx.destination);s.start(0);
    audioUnlocked=true;
    const btn=document.getElementById("unlock-btn");
    btn.textContent="✓ Audio ready";btn.style.background="#374151";btn.style.borderColor="#505060";btn.style.color="#a0a0b0";btn.disabled=true;
    document.getElementById("audio-hint").textContent="Click any key to hear it";
  }catch(e){document.getElementById("audio-hint").textContent="Audio not available";}
}

function playNote(midi,dur=0.9,delay=0){
  if(!audioUnlocked||!audioCtx)return;
  if(audioCtx.state==="suspended")audioCtx.resume();
  const ac=audioCtx,t=ac.currentTime+delay;
  const freq=440*Math.pow(2,(midi-69)/12);
  const g=ac.createGain();g.connect(ac.destination);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.24,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [1,2,3,4].forEach((h,i)=>{
    const osc=ac.createOscillator();osc.type="sine";
    osc.frequency.value=freq*h;
    const hg=ac.createGain();hg.gain.value=[1,0.35,0.14,0.06][i];
    osc.connect(hg);hg.connect(g);
    osc.start(t);osc.stop(t+dur+0.05);
  });
}

const canvas=document.getElementById("fb");
const ctx=canvas.getContext("2d");
function computeBaseScale(){
  const outer=document.getElementById("fb-outer");
  const w=(outer&&outer.clientWidth)||window.innerWidth;
  if(w>700) return 1;
  const targetWhiteKeys=8;
  return Math.max(0.8,Math.min(2,w/(targetWhiteKeys*WKW)));
}
const baseScale=computeBaseScale();
const ZOOM_KEY="pianoKeyboardZoom";
let userZoom=1;
try{ const saved=parseFloat(localStorage.getItem(ZOOM_KEY)); if(!isNaN(saved)) userZoom=Math.max(0.6,Math.min(2,saved)); }catch(e){}
function resizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  const scale=baseScale*userZoom;
  canvas.style.width=(CVW*scale)+"px";
  canvas.style.height=(CVH*scale)+"px";
  canvas.width=Math.round(CVW*scale*dpr);
  canvas.height=Math.round(CVH*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
resizeCanvas();
document.getElementById("zoom-label").textContent=Math.round(userZoom*100)+"%";
function setZoom(z){
  userZoom=Math.max(0.6,Math.min(2,z));
  resizeCanvas();draw();
  document.getElementById("zoom-label").textContent=Math.round(userZoom*100)+"%";
  try{ localStorage.setItem(ZOOM_KEY,userZoom); }catch(e){}
}
document.getElementById("zoom-in").onclick=()=>setZoom(userZoom+0.25);
document.getElementById("zoom-out").onclick=()=>setZoom(userZoom-0.25);

function draw(){
  const sc=SCALES[SCNAMES[scaleIdx]];
  const sMap={};sc.i.forEach((iv,i)=>{sMap[(rootIdx+iv)%12]=sc.d[i];});
  nodes=[];
  const T=th(),c=ctx;
  c.clearRect(0,0,CVW,CVH);
  c.fillStyle=T.canvasBg;c.fillRect(0,0,CVW,CVH);

  KEYS.filter(k=>k.white).forEach(k=>{
    c.fillStyle=T.whiteKey;c.fillRect(k.x,PT,k.w,k.h);
    c.strokeStyle=T.whiteKeyStroke;c.lineWidth=1;c.strokeRect(k.x,PT,k.w,k.h);
    const pitch=k.midi%12;
    if(sMap[pitch]!==undefined){
      const deg=sMap[pitch],col=nodeCol(deg),cx=k.x+k.w/2,cy=PT+k.h-38;
      c.save();
      if(!quizMode){c.shadowColor=col.glow;c.shadowBlur=10;}
      c.beginPath();c.arc(cx,cy,15,0,Math.PI*2);
      if(quizMode){c.fillStyle="rgba(0,0,0,0)";c.fill();c.shadowBlur=0;c.strokeStyle="#f59e0b";c.lineWidth=2.2;c.stroke();}
      else{c.fillStyle=col.fill;c.fill();}
      c.restore();
      if(!quizMode){
        const lbl=showNames?ROOTS[pitch]:(showDegrees?deg:"");
        if(lbl){c.save();c.shadowBlur=0;c.fillStyle=col.text;c.textAlign="center";c.textBaseline="middle";c.font="bold "+(lbl.length>2?"9":"11")+"px sans-serif";c.fillText(lbl,cx,cy);c.restore();}
      }
      nodes.push({midi:k.midi,deg,noteName:ROOTS[pitch]+octaveOf(k.midi),pitch,cx,cy,white:true});
    }
  });
  KEYS.filter(k=>!k.white).forEach(k=>{
    c.fillStyle=T.blackKey;c.fillRect(k.x,PT,k.w,k.h);
    c.strokeStyle=T.blackKeyStroke;c.lineWidth=1;c.strokeRect(k.x,PT,k.w,k.h);
    const pitch=k.midi%12;
    if(sMap[pitch]!==undefined){
      const deg=sMap[pitch],col=nodeCol(deg),cx=k.x+k.w/2,cy=PT+k.h-24;
      c.save();
      if(!quizMode){c.shadowColor=col.glow;c.shadowBlur=10;}
      c.beginPath();c.arc(cx,cy,11,0,Math.PI*2);
      if(quizMode){c.fillStyle="rgba(0,0,0,0)";c.fill();c.shadowBlur=0;c.strokeStyle="#f59e0b";c.lineWidth=2;c.stroke();}
      else{c.fillStyle=col.fill;c.fill();}
      c.restore();
      if(!quizMode){
        const lbl=showNames?ROOTS[pitch]:(showDegrees?deg:"");
        if(lbl){c.save();c.shadowBlur=0;c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";c.font="bold 8px sans-serif";c.fillText(lbl,cx,cy);c.restore();}
      }
      nodes.push({midi:k.midi,deg,noteName:ROOTS[pitch]+octaveOf(k.midi),pitch,cx,cy,white:false});
    }
  });

  c.textAlign="center";c.textBaseline="top";c.font="10px sans-serif";c.fillStyle=T.octLbl;
  KEYS.filter(k=>k.white&&k.name==='C').forEach(k=>{ c.fillText('C'+octaveOf(k.midi),k.x+k.w/2,PT+k.h+5); });

  const noteNames=sc.i.map(iv=>ROOTS[(rootIdx+iv)%12]);
  document.getElementById("info").textContent=ROOTS[rootIdx]+" "+SCNAMES[scaleIdx]+" · "+noteNames.join(" – ")+" · "+sc.d.join(" – ");
}

function hit(mx,my){
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i],dx=mx-n.cx,dy=my-n.cy;const r=n.white?17:13;if(dx*dx+dy*dy<=r*r)return n;}return null;
}
canvas.addEventListener("click",e=>{
  const r=canvas.getBoundingClientRect();
  const n=hit((e.clientX-r.left)*CVW/r.width,(e.clientY-r.top)*CVH/r.height);
  if(!n)return;playNote(n.midi);if(quizMode)startQuiz(n);else showTip(e,n);
});
canvas.addEventListener("mousemove",e=>{
  if(quizMode){hideTip();return;}
  const r=canvas.getBoundingClientRect();
  const n=hit((e.clientX-r.left)*CVW/r.width,(e.clientY-r.top)*CVH/r.height);
  n?(canvas.style.cursor="pointer",showTip(e,n)):(canvas.style.cursor="default",hideTip());
});
canvas.addEventListener("mouseleave",hideTip);
function showTip(e,n){
  const tt=document.getElementById("tooltip");
  const or=document.getElementById("fb-outer").getBoundingClientRect();
  tt.innerHTML="<strong>"+n.noteName+"</strong> <span style='opacity:.6'>("+n.deg+")</span>";
  tt.style.display="block";
  tt.style.left=(e.clientX-or.left+document.getElementById("fb-outer").scrollLeft+12)+"px";
  tt.style.top=Math.max(2,e.clientY-or.top-40)+"px";
}
function hideTip(){document.getElementById("tooltip").style.display="none";}

function startQuiz(n){
  const sc=SCALES[SCNAMES[scaleIdx]];
  const opts=[n.deg];const pool=sc.d.filter(d=>d!==n.deg);
  while(opts.length<Math.min(4,sc.d.length)){opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  opts.sort(()=>Math.random()-.5);
  document.getElementById("quiz-q").textContent="What degree is "+n.noteName+"?";
  document.getElementById("quiz-feedback").textContent="";
  const od=document.getElementById("quiz-opts");od.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.style.cssText="font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;background:#303055;color:#d0d0f0;border:1px solid #505070";
    b.textContent=o;
    b.onmouseenter=()=>{b.style.background="#3a3a65";};
    b.onmouseleave=()=>{if(!b.disabled)b.style.background="#303055";};
    b.onclick=()=>{
      const ok=o===n.deg;ok?quizScore.r++:quizScore.w++;
      document.getElementById("quiz-feedback").style.color=ok?"#4ade80":"#f43f5e";
      document.getElementById("quiz-feedback").textContent=ok?"✓ Correct — "+n.noteName+" is the "+n.deg:"✗ It's the "+n.deg+", not the "+o;
      const t=quizScore.r+quizScore.w;
      document.getElementById("quiz-score").textContent=quizScore.r+"/"+t+" correct ("+Math.round(100*quizScore.r/t)+"%)";
      od.querySelectorAll("button").forEach(btn=>{
        btn.disabled=true;
        if(btn.textContent===n.deg){btn.style.background="#14532d";btn.style.color="#4ade80";}
        else if(btn.textContent===o&&!ok){btn.style.background="#450a0a";btn.style.color="#f43f5e";}
      });
    };
    od.appendChild(b);
  });
}

document.getElementById("unlock-btn").addEventListener("click",initAudio);
buildSegs();buildActionRow();draw();
</script>
</body>
